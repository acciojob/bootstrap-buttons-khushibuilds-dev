<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	  <link href="https://jsdelivr.net" rel="stylesheet">
</head>

<body>
	<!-- the entire body must be written by student -->
	<div class="container my-5">
    <h2 class="mb-4">Bootstrap Buttons</h2>
    
    <div class="d-grid gap-3">
      <!-- Button 1: Primary button -->
      <div>
        <button type="button" id="button-1" class="btn btn-primary">Primary Button</button>
      </div>

      <!-- Button 2: Outline secondary button -->
      <div>
        <button type="button" id="button-2" class="btn btn-outline-secondary">Outline Secondary</button>
      </div>

      <!-- Button 3: Success large button -->
      <div>
        <button type="button" id="button-3" class="btn btn-success btn-lg">Success Large</button>
      </div>

      <!-- Button 4: Danger small button -->
      <div>
        <button type="button" id="button-4" class="btn btn-danger btn-sm">Danger Small</button>
      </div>

      <!-- Button 5: Warning large full-screen width button -->
      <div>
        <button type="button" id="button-5" class="btn btn-warning btn-lg w-100">Warning Large Full-Width</button>
      </div>

      <!-- Button 6: Disabled info button -->
      <div>
        <button type="button" id="button-6" class="btn btn-info" disabled>Disabled Info</button>
      </div>

      <!-- Button 7: Light button -->
      <div>
        <button type="button" id="button-7" class="btn btn-light">Light Button</button>
      </div>

      <!-- Button 8: Link button -->
      <div>
        <button type="button" id="button-8" class="btn btn-link">Link Button</button>
      </div>
    </div>

  </div>

    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
